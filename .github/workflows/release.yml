name: Release

# Stages a release on npm when a GitHub release is published (tag must be v<package.json version>).
# A maintainer then approves the staged version on npmjs.com (with 2FA) to make it live.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Trusted publishing (OIDC, no npm token) and `npm stage publish` need a current npm.
      - run: npm install -g npm@latest

      - run: npm ci
      # prepublishOnly runs lint, typecheck, tests and build before publishing.
      # npm authenticates via OIDC and adds provenance automatically. The trusted publisher
      # only allows staging, so nothing goes live until it is approved on npmjs.com.
      - run: npm stage publish --access public
